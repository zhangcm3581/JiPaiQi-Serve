<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JiPaiQi · 管理控制台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body data-page="{{ page }}">
    {% include 'partials/icons.html' %}{% include 'partials/sidebar.html' %}
    <main>
      <header>
        <div class="crumb">
          工作空间 <span>/</span><strong id="pageCrumb"></strong>
        </div>
        <div class="header-right">
          <span id="today"></span
          ><span class="previewbadge">JiPaiQi Serve</span>
        </div>
      </header>
      <div class="content">
        {% block content %}{% endblock %}
        <footer class="footer">
          <span>JiPaiQi Console</span
          ><span>数据持久化至 SQLite · 版本按租户独立维护</span>
        </footer>
      </div>
    </main>
    {% include 'partials/tenant-modal.html' %}
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
